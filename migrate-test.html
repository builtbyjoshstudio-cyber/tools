<!-- TEMPORARY hand-test page for the data bridge (migrate.html). Not linked, not in the sitemap, no analytics;
     sw.js leaves it alone. Remove after testing, with 'bbj-migrate-test' in migrate.html's allow-list. -->
<h1>Data bridge test, step 1 (tools site)</h1>
<p>Test value saved in this browser on tools.builtbyjoshstudio.com: <code id="v">none</code></p>
<p><button type="button" id="save">Save a new test value</button></p>
<p>Then open step 2 in the same browser:<br><a href="https://cooking.builtbyjoshstudio.com/migrate-test/">cooking.builtbyjoshstudio.com/migrate-test/</a></p>
<script>
(function () {
  var KEY = 'bbj-migrate-test', out = document.getElementById('v');
  function show() { var v = null; try { v = localStorage.getItem(KEY); } catch (e) { v = 'storage blocked'; } out.textContent = v || 'none'; }
  document.getElementById('save').addEventListener('click', function () {
    try { localStorage.setItem(KEY, 'TEST-' + Math.floor(1000 + Math.random() * 9000)); } catch (e) { /* blocked */ }
    show();
  });
  show();
})();
</script>
</body>
